name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *" # daily, 06:17 Addis Ababa
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Pull live stats and re-render
        run: python scripts/render.py --refresh
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) if you
          # want private contributions counted exactly like your profile shows.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets stats.json
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
