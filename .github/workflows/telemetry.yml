name: Telemetry

on:
  schedule:
    - cron: "23 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "README.md"]

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Pull live data and re-render
        run: python scripts/render.py --refresh
        env:
          # Optional: a PROFILE_TOKEN secret (classic PAT with read:user and repo)
          # also counts private repos' languages. The default token sees public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets stats.json
          git diff --cached --quiet || (git commit -m "telemetry: refresh" && git push)
