name: Update Profile Stats

on:
  schedule:
    # Runs once a day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make assets folder
        run: mkdir -p profile-assets

      # --- Stats card ---------------------------------------------------
      # Replace STATS_HOST below with your own deployed instance once you
      # have one, e.g. https://github-readme-stats-yourname.vercel.app
      - name: Fetch stats card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api?username=solomon-mh&show_icons=true&locale=en&hide_border=true&theme=tokyonight" \
            -o profile-assets/stats.svg || echo "stats card fetch failed, keeping previous version"

      - name: Fetch top languages
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api/top-langs/?username=solomon-mh&layout=compact&locale=en&hide_border=true&theme=tokyonight" \
            -o profile-assets/top-langs.svg || echo "top-langs fetch failed, keeping previous version"

      # --- Streak stats ---------------------------------------------------
      - name: Fetch streak stats
        run: |
          curl -sf "https://streak-stats.demolab.com/?user=solomon-mh&hide_border=true&theme=tokyonight" \
            -o profile-assets/streak.svg || echo "streak fetch failed, keeping previous version"

      # --- Trophies ---------------------------------------------------
      - name: Fetch trophies
        run: |
          curl -sf "https://github-profile-trophy-winning.vercel.app/?username=solomon-mh&theme=tokyonight&column=7&margin-w=8&margin-h=8" \
            -o profile-assets/trophies.svg || echo "trophies fetch failed, keeping previous version"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-assets/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh profile stats"
          git push
